openapi: 3.1.2
info:
  title: Phone Store API
  version: 0.1.0
  description: Contract template for the Phone Store modular monolith.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://localhost:8080
    description: Local development
tags: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size; replace the maximum with the verified project limit.
      schema:
        type: integer
        minimum: 1
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Sort expression restricted by the endpoint allowlist.
      schema:
        type: string
      example: createdAt,desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for retrying the same critical command without duplicate effects.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: 018f47b7-1a2b-7c3d-8e9f-0123456789ab
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          example: '29990000.00'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: VND
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        requestId:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required: [fieldErrors]
          properties:
            fieldErrors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [number, size, totalElements, totalPages, first, last]
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean
