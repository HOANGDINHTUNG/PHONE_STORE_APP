openapi: 3.0.3
info:
  title: Phone Store E-Commerce Platform API
  version: 1.0.0
  description: API documentation for the Phone Store E-Commerce Platform backend services.
servers:
  - url: http://localhost:8080
    description: local dev server
tags:
