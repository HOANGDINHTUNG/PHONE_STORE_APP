openapi: 3.1.0
info:
  title: Phone Store Backend API
  version: 0.1.0
servers:
  - url: /api/v1
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [code, message, status, path, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        path:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string

