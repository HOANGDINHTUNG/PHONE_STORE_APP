  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: API Endpoint
      description: API Description
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: API Description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: API Description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                UsernameTaken:
                  summary: API Endpoint
                  value:
                    errorCode: BAD_REQUEST
                    message: Username is already taken
                    correlationId: df185ee6-d7e7-494b-a63e-f1b203c9bf82
                EmailRegistered:
                  summary: API Endpoint
                  value:
                    errorCode: BAD_REQUEST
                    message: Email is already registered
                    correlationId: a5f2da51-419b-4e08-9fd1-cb4be6c1e345
                ValidationFailed:
                  summary: API Endpoint
                  value:
                    errorCode: VALIDATION_FAILED
                    message: Error
                    fieldErrors:
                      username: Username must be between 3 and 100 characters
                      email: Invalid email format
                      password: Password must be between 8 and 64 characters
                    correlationId: 3d50b4f8-e1a1-432d-8b01-df5f1d93bff0
