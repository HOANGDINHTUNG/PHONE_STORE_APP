openapi: 3.1.0

info:
  title: Phone Store E-Commerce Platform API
  version: 1.0.0
  description: API documentation for the Phone Store E-Commerce Platform backend services.

servers:
  - url: /api/v1
    description: local dev server

paths:

  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Get cart info
      responses:
        '200':
          description: OK
  /api/v1/cart/items:
    post:
      tags:
        - Cart
      summary: Add to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
  /api/v1/cart/items/{itemId}:
    delete:
      tags:
        - Cart
      summary: Delete Cart Item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/cart/merge:
    post:
      tags:
        - Cart
      summary: Merge Guest Cart
      responses:
        '200':
          description: OK
  /api/v1/admin/coupons:
    get:
      tags:
        - Admin Coupons
      summary: get all coupons
      responses:
        '200':
          description: OK
    post:
      tags:
        - Admin Coupons
      summary: Create Coupon
      requestBody:
