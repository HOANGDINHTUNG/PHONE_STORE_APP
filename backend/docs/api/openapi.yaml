          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    patch:
      tags:
        - Admin Coupons
      summary: Invalidate Coupon
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/v1/admin/coupons/{code}/targets:
