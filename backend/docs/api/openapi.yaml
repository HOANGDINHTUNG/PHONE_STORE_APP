                UserDeactivated:
                  summary: API Endpoint
                  value:
                    errorCode: BAD_REQUEST
                    message: User account is deactivated
                    correlationId: 2df3e485-bc75-4d0f-8973-455bdaef3841
                ValidationFailed:
                  summary: API Endpoint
                  value:
                    errorCode: VALIDATION_FAILED
                    message: Error
                    fieldErrors:
