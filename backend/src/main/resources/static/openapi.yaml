openapi: 3.1.0info:  title: Phone Store E-Commerce Platform API  version: 1.0.0  description: API documentation for the Phone Store E-Commerce Platform backend services.servers:  - url: /api/v1    description: local dev servertags:  - name: Authentication  - name: Profile  - name: Organization Management  - name: Admin User Management  - name: Category Admin  - name: Category  - name: Admin Catalog  - name: Product Catalog  - name: Procurement and Inventory  - name: Admin Coupons  - name: Cart  - name: Shipping Address  - name: Sales Order Management  - name: Payment  - name: Shipment  - name: Return, Exchange and Refund  - name: Admin Return  - name: Admin Refund  - name: Warranty  - name: Admin Warrantypaths:  /api/v1/auth/email-verifications:    post:      tags:        - Authentication      summary: API Endpoint      operationId: resendVerificationEmail      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/EmailVerificationRequest"      responses:        "202":          description: API Description        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/auth/email-verifications/confirm:    post:      tags:        - Authentication      summary: API Endpoint      operationId: confirmEmail      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/EmailVerificationConfirmRequest"      responses:        "204":          description: API Description        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/auth/login:    post:      tags:        - Authentication      summary: API Endpoint      description: API Description      operationId: loginUser      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/LoginRequest"      responses:        "200":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/AuthResponse"        "400":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/ApiError"              examples:                InvalidCredentials:                  summary: API Endpoint                  value:                    errorCode: BAD_REQUEST                    message: Invalid username or password                    correlationId: a6b7c8d9-e0f1-42a3-b4c5-d6e7f8a9b0c1                UserDeactivated:                  summary: API Endpoint                  value:                    errorCode: BAD_REQUEST                    message: User account is deactivated                    correlationId: 2df3e485-bc75-4d0f-8973-455bdaef3841                ValidationFailed:                  summary: API Endpoint                  value:                    errorCode: VALIDATION_FAILED                    message: Error                    fieldErrors:                      username: Username is required                      password: Password is required                    correlationId: dcba0987-7654-3210-fedc-ba9876543210        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/auth/logout:    post:      tags:        - Authentication      summary: API Endpoint      operationId: logoutUser      security:        - BearerAuth: []      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/LogoutRequest"      responses:        "204":          description: API Description        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/auth/password-reset-requests:    post:      tags:        - Authentication      summary: API Endpoint      operationId: requestPasswordReset      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/PasswordResetRequest"      responses:        "202":          description: API Description        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/auth/password-resets/confirm:    post:      tags:        - Authentication      summary: API Endpoint      operationId: confirmPasswordReset      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/PasswordResetConfirmRequest"      responses:        "204":          description: API Description        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/auth/register:    post:      tags:        - Authentication      summary: API Endpoint      description: API Description      operationId: registerUser      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/RegisterRequest"      responses:        "201":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/AuthResponse"        "400":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/ApiError"              examples:                UsernameTaken:                  summary: API Endpoint                  value:                    errorCode: BAD_REQUEST                    message: Username is already taken                    correlationId: df185ee6-d7e7-494b-a63e-f1b203c9bf82                EmailRegistered:                  summary: API Endpoint                  value:                    errorCode: BAD_REQUEST                    message: Email is already registered                    correlationId: a5f2da51-419b-4e08-9fd1-cb4be6c1e345                ValidationFailed:                  summary: API Endpoint                  value:                    errorCode: VALIDATION_FAILED                    message: Error                    fieldErrors:                      username: Username must be between 3 and 100 characters                      email: Invalid email format                      password: Password must be between 8 and 64 characters                    correlationId: 3d50b4f8-e1a1-432d-8b01-df5f1d93bff0        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/auth/token/refresh:    post:      tags:        - Authentication      summary: API Endpoint      description: API Description      operationId: refreshToken      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/TokenRefreshRequest"      responses:        "200":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/AuthResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/me:    get:      tags:        - Profile      summary: API Endpoint      operationId: getCurrentProfile      security:        - BearerAuth: []      responses:        "200":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/UserResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"    patch:      tags:        - Profile      summary: API Endpoint      operationId: updateCurrentProfile      security:        - BearerAuth: []      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/UserProfileUpdateRequest"      responses:        "200":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/UserResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/departments:    post:      tags:        - Organization Management      summary: API Endpoint      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/DepartmentRequest"      responses:        "201":          description: Created          content:            application/json:              schema:                $ref: "#/components/schemas/DepartmentResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"    get:      tags:        - Organization Management      summary: API Endpoint      parameters:        - name: page          in: query          schema:            type: integer        - name: size          in: query          schema:            type: integer      responses:        "200":          description: OK        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/departments/{id}:    get:      description: New endpoint      responses:        200:          description: New response          content:            application/json:              schema:                type: object    put:      tags:        - Organization Management      summary: API Endpoint      parameters:        - name: id          in: path          required: true          schema:            type: string            format: uuid      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/DepartmentRequest"      responses:        "200":          description: OK          content:            application/json:              schema:                $ref: "#/components/schemas/DepartmentResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/positions:    post:      tags:        - Organization Management      summary: API Endpoint      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/PositionRequest"      responses:        "201":          description: Created          content:            application/json:              schema:                $ref: "#/components/schemas/PositionResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"    get:      tags:        - Organization Management      summary: API Endpoint      responses:        "200":          description: OK        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/roles:    post:      tags:        - Organization Management      summary: API Endpoint      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/RoleRequest"      responses:        "201":          description: Created        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"    get:      tags:        - Organization Management      summary: API Endpoint      responses:        "200":          description: OK        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/staff:    post:      tags:        - Organization Management      summary: API Endpoint      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/StaffRequest"      responses:        "201":          description: Created        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"    get:      tags:        - Organization Management      summary: API Endpoint      responses:        "200":          description: OK        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/admin/users:    get:      tags:        - Admin User Management      summary: API Endpoint      operationId: listUsers      security:        - BearerAuth: []      parameters:        - name: keyword          in: query          schema:            type: string        - name: status          in: query          schema:            type: string      responses:        "200":          description: Success          content:            application/json:              schema:                type: array                items:                  $ref: "#/components/schemas/UserResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/admin/users/{userId}:    get:      tags:        - Admin User Management      summary: API Endpoint      operationId: getUser      security:        - BearerAuth: []      parameters:        - name: userId          in: path          required: true          schema:            type: string            format: uuid      responses:        "200":          description: Success          content:            application/json:              schema:                $ref: "#/components/schemas/UserResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"    patch:      tags:        - Admin User Management      summary: API Endpoint      operationId: adminUpdateUser      security:        - BearerAuth: []      parameters:        - name: userId          in: path          required: true          schema:            type: string            format: uuid      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/UserUpdateAdminRequest"      responses:        "200":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/UserResponse"        "400":          description: API Description        "409":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/ApiError"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/admin/users/{userId}/status:    patch:      tags:        - Admin User Management      summary: API Endpoint      operationId: changeUserStatus      security:        - BearerAuth: []      parameters:        - name: userId          in: path          required: true          schema:            type: string            format: uuid        - name: status          in: query          required: true          schema:            type: string      responses:        "200":          description: Success          content:            application/json:              schema:                $ref: "#/components/schemas/UserResponse"        "400":          $ref: "#/components/responses/BadRequest"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/admin/categories:    post:      security:        - BearerAuth: []      tags:        - Category Admin      summary: API Endpoint      description: API Description      operationId: createCategory      requestBody:        required: true        content:          application/json:            schema:              $ref: "#/components/schemas/CategoryRequest"      responses:        "201":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/CategoryResponse"        "400":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/ApiError"        "409":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/ApiError"              examples:                SlugExists:                  summary: API Endpoint                  value:                    errorCode: CATEGORY_SLUG_EXISTS                    message: Error                    correlationId: db6ef274-129b-4e08-9fd1-cb4be6c1e345        "422":          description: API Description          content:            application/json:              schema:                $ref: "#/components/schemas/ApiError"        "401":          $ref: "#/components/responses/Unauthorized"        "403":          $ref: "#/components/responses/Forbidden"        "404":          $ref: "#/components/responses/NotFound"        "500":          $ref: "#/components/responses/InternalServerError"    get:      security:        - BearerAuth: []      tags:        - Category Admin      summary: API Endpoint      description: API Description      operationId: adminListCategories      parameters:        - name: status          in: query          required: false          schema:            type: string            enum: [ACTIVE, INACTIVE]        - name: keyword          in: query          required: false          schema:            type: string      responses:        "200":          description: API Description          content:            application/json:              schema:                type: array                items:                  $ref: "#/components/schemas/CategoryResponse"        "401":          description: API Description        "403":          description: API Description        "400":          $ref: "#/components/responses/BadRequest"        "404":          $ref: "#/components/responses/NotFound"        "422":          $ref: "#/components/responses/UnprocessableEntity"        "500":          $ref: "#/components/responses/InternalServerError"  /api/v1/admin/categories/{categoryId}:    get:      security:        - BearerAuth: []      tags:        - Category Admin      summary: API Endpoint      operationId: getCategoryById      parameters:        - name: categoryId          in: path          required